<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>מה מגיע לי</title>
  <meta name="description" content="בדיקת קרדיט, RIG ופיצויים מול לוח התכנון והרומה. הכול מחושב על המכשיר.">
  <meta name="theme-color" content="#0b3a6e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="מה מגיע לי">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>מה מגיע לי</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="check" aria-selected="true">בדיקה</button>
      <button role="tab" data-view="history" aria-selected="false">חודשים שמורים</button>
      <button role="tab" data-view="rules" aria-selected="false">חוקים</button>
    </nav>
    <p class="credit">האפליקציה הוכנה באהבה על ידי קלוד בהכוונה של ניצן בארי</p>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>

    <section id="view-check" class="view">
      <div class="uploads no-print">
        <label class="drop" data-kind="plan">
          <input type="file" accept="application/pdf,.pdf" hidden>
          <span class="drop-title">תכנון</span>
          <span class="drop-sub">קובץ duty plan</span>
          <span class="drop-state">לא נבחר קובץ</span>
          <button type="button" class="drop-file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg><span class="drop-file-text"><span class="drop-month"></span><span class="drop-name"></span></span></button>
          <button type="button" class="drop-pick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 9l5-5 5 5M12 4v12"/></svg>בחר חודש אחר</button>
        </label>
        <label class="drop" data-kind="exec">
          <input type="file" accept="application/pdf,.pdf" hidden>
          <span class="drop-title">ביצוע</span>
          <span class="drop-sub">קובץ PDF מרומה עם details</span>
          <span class="drop-state">לא נבחר קובץ</span>
          <button type="button" class="drop-file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"/></svg><span class="drop-file-text"><span class="drop-month"></span><span class="drop-name"></span></span></button>
          <button type="button" class="drop-pick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M7 9l5-5 5 5M12 4v12"/></svg>בחר חודש אחר</button>
        </label>
      </div>
      <p class="hint no-print">אפשר להעלות אחד מהקבצים או את שניהם. הקבצים נקראים על המכשיר ולא נשלחים לשום מקום.</p>
      <div id="calendar-bar" class="calendar-bar no-print"></div>
      <div id="results"></div>
    </section>

    <section id="view-history" class="view" hidden></section>
    <section id="view-rules" class="view" hidden></section>
  </main>
  <dialog id="calendar-dialog" class="dialog no-print"></dialog>
</body>
</html>
